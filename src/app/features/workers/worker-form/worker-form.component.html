<div class="page-container fade-in">
  <div class="page-header"><h1 class="page-title">{{ isEdit ? 'Editar barbero' : 'Nuevo barbero' }}</h1></div>
  <div class="card" style="max-width:600px">
    <div *ngIf="loading" class="text-center"><mat-spinner diameter="36" style="margin:auto"></mat-spinner></div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loading">
      <div class="form-row">
        <mat-form-field appearance="outline"><mat-label>Nombre *</mat-label><input matInput formControlName="nombre"><mat-error>Requerido</mat-error></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Apellido *</mat-label><input matInput formControlName="apellido"><mat-error>Requerido</mat-error></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Teléfono *</mat-label><input matInput formControlName="telefono"><mat-error>Requerido</mat-error></mat-form-field>
        <mat-form-field appearance="outline"><mat-label>Especialidad *</mat-label><input matInput formControlName="especialidad"><mat-error>Requerido</mat-error></mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>% Comisión *</mat-label>
          <input matInput type="number" formControlName="porcentajeComision" min="0" max="100">
          <span matSuffix>%</span>
          <mat-error>Valor entre 0-100</mat-error>
        </mat-form-field>
      </div>
      <div class="form-actions">
        <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="saving">
          <mat-spinner diameter="18" *ngIf="saving"></mat-spinner>
          <span *ngIf="!saving">{{ isEdit ? 'Guardar' : 'Crear barbero' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
