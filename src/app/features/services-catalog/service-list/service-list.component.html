<div class="page-container fade-in">
  <div class="page-header">
    <div><h1 class="page-title">Catálogo de Servicios</h1></div>
    <button mat-flat-button color="primary" routerLink="/services/new"><mat-icon>add</mat-icon> Nuevo servicio</button>
  </div>
  <div class="card">
    <mat-form-field appearance="outline" class="search-field mb-16"><mat-label>Buscar</mat-label><input matInput (keyup)="applyFilter($event)"><mat-icon matSuffix>search</mat-icon></mat-form-field>
    <div *ngIf="loading" class="text-center"><mat-spinner diameter="40" style="margin:auto"></mat-spinner></div>
    <table mat-table [dataSource]="dataSource" matSort *ngIf="!loading">
      <ng-container matColumnDef="nombre"><th mat-header-cell *matHeaderCellDef mat-sort-header>Servicio</th><td mat-cell *matCellDef="let s">{{ s.nombre }}</td></ng-container>
      <ng-container matColumnDef="categoria"><th mat-header-cell *matHeaderCellDef>Categoría</th><td mat-cell *matCellDef="let s">{{ s.categoria }}</td></ng-container>
      <ng-container matColumnDef="precio"><th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th><td mat-cell *matCellDef="let s">S/ {{ s.precio | number:'1.2-2' }}</td></ng-container>
      <ng-container matColumnDef="duracionMinutos"><th mat-header-cell *matHeaderCellDef>Duración</th><td mat-cell *matCellDef="let s">{{ s.duracionMinutos }} min</td></ng-container>
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let s"><mat-slide-toggle [checked]="s.estado" (change)="toggle(s)" color="primary"></mat-slide-toggle></td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let s"><button mat-icon-button [routerLink]="['/services', s.id]" matTooltip="Editar"><mat-icon>edit</mat-icon></button></td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10,25]" showFirstLastButtons *ngIf="!loading"></mat-paginator>
  </div>
</div>
