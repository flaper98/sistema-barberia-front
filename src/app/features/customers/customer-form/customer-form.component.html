<div class="page-container fade-in">
  <div class="page-header">
    <h1 class="page-title">{{ isEdit ? 'Editar cliente' : 'Nuevo cliente' }}</h1>
  </div>
  <div class="card" style="max-width:700px">
    <div *ngIf="loading" class="text-center"><mat-spinner diameter="36" style="margin:auto"></mat-spinner></div>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loading">
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Nombre *</mat-label>
          <input matInput formControlName="nombre">
          <mat-error *ngIf="form.get('nombre')?.hasError('required')">Requerido</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Apellido *</mat-label>
          <input matInput formControlName="apellido">
          <mat-error *ngIf="form.get('apellido')?.hasError('required')">Requerido</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Teléfono *</mat-label>
          <input matInput formControlName="telefono" type="tel">
          <mat-icon matPrefix>phone</mat-icon>
          <mat-error *ngIf="form.get('telefono')?.hasError('required')">Requerido</mat-error>
          <mat-error *ngIf="form.get('telefono')?.hasError('pattern')">Mínimo 9 dígitos</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Correo</mat-label>
          <input matInput formControlName="correo" type="email">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="form.get('correo')?.hasError('email')">Correo inválido</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Fecha de nacimiento</mat-label>
          <input matInput [matDatepicker]="dp" formControlName="fechaNacimiento">
          <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
          <mat-datepicker #dp></mat-datepicker>
        </mat-form-field>
      </div>
      <mat-form-field appearance="outline" class="w-full mt-8">
        <mat-label>Notas</mat-label>
        <textarea matInput formControlName="notas" rows="2"></textarea>
      </mat-form-field>
      <div class="form-actions">
        <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="saving">
          <mat-spinner diameter="18" *ngIf="saving"></mat-spinner>
          <span *ngIf="!saving">{{ isEdit ? 'Guardar cambios' : 'Crear cliente' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
