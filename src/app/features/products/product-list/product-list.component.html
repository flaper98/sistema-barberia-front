<div class="page-container fade-in">
  <div class="page-header">
    <div><h1 class="page-title">Productos</h1></div>
    <button mat-flat-button color="primary" routerLink="/products/new"><mat-icon>add</mat-icon> Nuevo producto</button>
  </div>
  <div class="card">
    <mat-form-field appearance="outline" class="search-field mb-16">
      <mat-label>Buscar producto</mat-label>
      <input matInput (keyup)="applyFilter($event)">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
    <div *ngIf="loading" class="text-center"><mat-spinner diameter="40" style="margin:auto"></mat-spinner></div>
    <table mat-table [dataSource]="dataSource" matSort *ngIf="!loading">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Producto</th>
        <td mat-cell *matCellDef="let p">{{ p.nombre }}</td>
      </ng-container>
      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef>Categoría</th>
        <td mat-cell *matCellDef="let p">{{ p.categoria }}</td>
      </ng-container>
      <ng-container matColumnDef="precioVenta">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>P. Venta</th>
        <td mat-cell *matCellDef="let p">S/ {{ p.precioVenta | number:'1.2-2' }}</td>
      </ng-container>
      <ng-container matColumnDef="precioCompra">
        <th mat-header-cell *matHeaderCellDef>P. Compra</th>
        <td mat-cell *matCellDef="let p">S/ {{ p.precioCompra | number:'1.2-2' }}</td>
      </ng-container>
      <ng-container matColumnDef="stockActual">
        <th mat-header-cell *matHeaderCellDef>Stock</th>
        <td mat-cell *matCellDef="let p">
          <span [ngClass]="isLowStock(p) ? 'status-chip low-stock' : ''">
            {{ p.stockActual }} / {{ p.stockMinimo }}
          </span>
          <mat-icon *ngIf="isLowStock(p)" style="color:#F57F17;font-size:16px;vertical-align:middle" matTooltip="Stock bajo">warning</mat-icon>
        </td>
      </ng-container>
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let p"><span class="status-chip" [ngClass]="p.estado ? 'active' : 'inactive'">{{ p.estado ? 'Activo' : 'Inactivo' }}</span></td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let p">
          <button mat-icon-button [routerLink]="['/products', p.id]" matTooltip="Editar"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button routerLink="/inventory" matTooltip="Ver movimientos"><mat-icon>warehouse</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[10,25]" showFirstLastButtons *ngIf="!loading"></mat-paginator>
  </div>
</div>
