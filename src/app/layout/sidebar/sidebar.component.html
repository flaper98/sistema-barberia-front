<div class="sidebar">
  <!-- Logo / Brand -->
  <div class="sidebar-brand">
    <mat-icon class="brand-icon">content_cut</mat-icon>
    <div class="brand-text">
      <span class="brand-name">BarberSystem</span>
      <span class="brand-sub">Sistema de gestión</span>
    </div>
  </div>

  <mat-divider class="sidebar-divider"></mat-divider>

  <!-- User info -->
  <div class="user-info" *ngIf="currentUser">
    <div class="user-avatar">{{ currentUser.avatar || (currentUser.nombre[0] + currentUser.apellido[0]) }}</div>
    <div class="user-details">
      <span class="user-name">{{ currentUser.nombre }} {{ currentUser.apellido }}</span>
      <span class="user-role">{{ currentUser.rol }}</span>
    </div>
  </div>

  <mat-divider class="sidebar-divider"></mat-divider>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ng-container *ngFor="let item of navItems">
      <a
        *ngIf="isVisible(item)"
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        matRipple>
        <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
        <span class="nav-badge" *ngIf="item.badge">{{ item.badge }}</span>
      </a>
    </ng-container>
  </nav>

  <!-- Logout -->
  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout()" matRipple>
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </div>
</div>
