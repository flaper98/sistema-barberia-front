<mat-toolbar class="navbar">
  <!-- Menu toggle -->
  <button mat-icon-button (click)="menuToggle.emit()" class="menu-btn">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- Page title -->
  <span class="page-title">{{ pageTitle }}</span>

  <span class="spacer"></span>

  <!-- Quick sale button -->
  <button mat-flat-button color="accent" class="quick-sale-btn" (click)="navigateToQuickSale()">
    <mat-icon>add_shopping_cart</mat-icon>
    <span class="btn-text">Venta rápida</span>
  </button>

  <!-- Notifications -->
  <button mat-icon-button [matMenuTriggerFor]="notifMenu" (menuOpened)="onNotifMenuOpened()" class="notif-btn" matTooltip="Notificaciones">
    <mat-icon [matBadge]="unreadCount > 0 ? unreadCount : null" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
  </button>

  <mat-menu #notifMenu="matMenu" xPosition="before" class="notif-menu">
    <div class="notif-header" (click)="$event.stopPropagation()">
      <div class="nh-title">
        <mat-icon>notifications</mat-icon>
        <strong>Notificaciones</strong>
        <span class="unread-chip" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </div>
      <button mat-icon-button color="primary" *ngIf="unreadCount > 0" (click)="marcarTodasLeidas()" matTooltip="Marcar todas como leídas">
        <mat-icon>done_all</mat-icon>
      </button>
    </div>
    <mat-divider></mat-divider>

    <div class="notif-list">
      <div class="notif-empty" *ngIf="!notifications.length">
        <mat-icon>notifications_none</mat-icon>
        <p>No tenés notificaciones</p>
        <span>Te avisamos apenas haya algo nuevo</span>
      </div>

      <button mat-menu-item *ngFor="let n of notifications" (click)="onNotifClick(n)" [class.unread]="!n.leida">
        <div class="notif-item">
          <div class="notif-icon-bubble" [ngClass]="n.tipo === 'CITA_ASIGNADA' ? 'cita' : 'venta'">
            <mat-icon>{{ n.tipo === 'CITA_ASIGNADA' ? 'event' : 'point_of_sale' }}</mat-icon>
          </div>
          <div class="notif-text">
            <span class="notif-msg">{{ n.mensaje }}</span>
            <small>{{ n.fecha | date:'dd/MM HH:mm' }}</small>
          </div>
          <span class="unread-dot" *ngIf="!n.leida" matTooltip="No leída"></span>
        </div>
      </button>
    </div>
  </mat-menu>

  <!-- User menu -->
  <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-btn">
    <div class="navbar-avatar" *ngIf="currentUser">
      {{ currentUser.avatar || (currentUser.nombre[0] + currentUser.apellido[0]) }}
    </div>
  </button>

  <mat-menu #userMenu="matMenu" xPosition="before">
    <div class="user-menu-header" *ngIf="currentUser">
      <strong>{{ currentUser.nombre }} {{ currentUser.apellido }}</strong>
      <small>{{ currentUser.email }}</small>
      <span class="role-chip">{{ currentUser.rol }}</span>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="cambiarPassword()">
      <mat-icon>lock_reset</mat-icon> Cambiar contraseña
    </button>
    <button mat-menu-item routerLink="/settings" *ngIf="authService.hasRole(['ADMIN'])">
      <mat-icon>settings</mat-icon> Configuración
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon> Cerrar sesión
    </button>
  </mat-menu>
</mat-toolbar>
