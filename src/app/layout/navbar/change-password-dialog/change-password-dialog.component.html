<h2 mat-dialog-title>Cambiar contraseña</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Contraseña actual</mat-label>
      <input matInput type="password" formControlName="currentPassword" autocomplete="current-password">
      <mat-error *ngIf="form.get('currentPassword')?.hasError('required')">Requerida</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Nueva contraseña</mat-label>
      <input matInput type="password" formControlName="newPassword" autocomplete="new-password">
      <mat-error *ngIf="form.get('newPassword')?.hasError('required')">Requerida</mat-error>
      <mat-error *ngIf="form.get('newPassword')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Confirmar nueva contraseña</mat-label>
      <input matInput type="password" formControlName="confirmPassword" autocomplete="new-password">
      <mat-error *ngIf="form.get('confirmPassword')?.hasError('required')">Requerida</mat-error>
    </mat-form-field>

    <p class="text-sm" style="color:var(--color-warn)" *ngIf="form.hasError('noCoincide') && form.get('confirmPassword')?.touched">
      Las contraseñas nuevas no coinciden
    </p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving || form.hasError('noCoincide')">
      <mat-spinner diameter="18" *ngIf="saving"></mat-spinner>
      <span *ngIf="!saving">Guardar</span>
    </button>
  </mat-dialog-actions>
</form>
